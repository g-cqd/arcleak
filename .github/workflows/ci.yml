name: CI

# The graph (lint, linux and macOS in parallel, release archives on main and tags, one required gate) lives in
# the shared workflow; this file only says what is specific to arcleak. A `v*` tag publishes the release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: Aemi-Studio/aemi/.github/workflows/swift-tool.yml@ci/shared-tool-workflow
    permissions:
      contents: write
    with:
      tool: arcleak
      linux-extra: Scripts/lsp-smoke.sh "$(swift build --show-bin-path)/arcleak"
      macos-extra: Scripts/run-leak-oracle.sh "$(swift build --show-bin-path)/leak-oracle"
      macos-timeout: 45
