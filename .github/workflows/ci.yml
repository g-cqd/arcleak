name: CI

# The graph (lint, linux and macOS in parallel, release archives on main and tags, one required gate) lives in
# the shared workflow; this file only says what is specific to arcleak. A `v*` tag publishes the release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: Aemi-Studio/aemi/.github/workflows/swift-tool.yml@18b02d36ed4bafd68afab7ea3894cc822c86e2f7 # aemi 18b02d3
    permissions:
      contents: write
    with:
      tool: arcleak
      # The LSP smoke test drives the server with python3, which the Linux image does not carry.
      macos-extra: |
        Scripts/run-leak-oracle.sh "$(swift build --show-bin-path)/leak-oracle"
        Scripts/lsp-smoke.sh "$(swift build --show-bin-path)/arcleak"
      macos-timeout: 45
